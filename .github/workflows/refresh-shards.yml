name: Refresh Test Shards

# The Pest shards are balanced by the test timings in tests/.pest/shards.json. A new test has
# no timing and goes to the shards in turn, so the balance drifts as tests are added. Once a
# week, this workflow records new timings and commits them to main. The file only splits the
# tests between the shards, so it cannot make a test pass or fail.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/pest.yml
    with:
      update_shards: true
    secrets: inherit

  commit:
    name: Commit the timings
    needs: tests
    # Another test job can fail at random. Only the artifact of the refresh job matters here,
    # and the download fails when that job did not upload it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Only admins and the CI app may push to main, so the push uses the token of the app.
      # The app has write access to contents and pull requests only.
      - name: Get a token of the CI app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAHO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAHO_CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shards-json
          path: tests/.pest

      - name: Commit the timings to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "Refreshed the test timings that balance the CI shards"
          # main can move during the test run, which takes more than an hour
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
