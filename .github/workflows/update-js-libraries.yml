name: Update JS Libraries

# Commits the files that "Check JS Libraries" recorded onto the pull request
# branch, so a Dependabot bump arrives complete. A workflow_run event is not a
# Dependabot event, so this workflow gets a write token where the pull_request
# one cannot.
#
# This job must never execute pull request code, so it does not check out the
# pull request. It writes the commit through the GitHub API, and it accepts only
# files under public/js. Adding a build step here would hand a write token to an
# untrusted postinstall script.

on:
  workflow_run:
    workflows: ['Check JS Libraries']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  update:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-libraries
          path: ${{ runner.temp }}/js-libraries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the recorded status
        id: status
        run: |
          status=$(cat "${{ runner.temp }}/js-libraries/status")
          echo "drift=$([ "$status" = drift ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Recorded status: $status"

      - name: Commit the files to the pull request branch
        if: steps.status.outputs.drift == 'true'
        working-directory: ${{ runner.temp }}/js-libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The artifact comes from a run of pull request code, so its paths are untrusted.
          check_path() {
            case "/$1/" in
              */../*|*/./*|*//*) echo "Refused the path '$1'." >&2; exit 1 ;;
            esac
            if [[ $1 != public/js/* ]]; then
              echo "Refused the path '$1': it is not under public/js." >&2
              exit 1
            fi
          }

          current=$(gh api "repos/{owner}/{repo}/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The branch moved after the check. The check of the new commit will update it."
            exit 0
          fi

          : > entries.jsonl
          while IFS= read -r -d '' path; do
            check_path "$path"
            if [ ! -f "files/$path" ] || [ -L "files/$path" ]; then
              echo "Refused '$path': it is not a regular file." >&2
              exit 1
            fi
            sha=$(base64 -w0 "files/$path" | jq -Rs '{content: ., encoding: "base64"}' \
              | gh api "repos/{owner}/{repo}/git/blobs" --input - --jq .sha)
            jq -nc --arg path "$path" --arg sha "$sha" '{path: $path, mode: "100644", type: "blob", sha: $sha}' >> entries.jsonl
          done < changed
          while IFS= read -r -d '' path; do
            check_path "$path"
            jq -nc --arg path "$path" '{path: $path, mode: "100644", type: "blob", sha: null}' >> entries.jsonl
          done < deleted

          base_tree=$(gh api "repos/{owner}/{repo}/git/commits/$HEAD_SHA" --jq .tree.sha)
          tree=$(jq -s --arg base "$base_tree" '{base_tree: $base, tree: .}' entries.jsonl \
            | gh api "repos/{owner}/{repo}/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$tree" --arg parent "$HEAD_SHA" \
            '{message: "Refreshed the committed JS libraries", tree: $tree, parents: [$parent]}' \
            | gh api "repos/{owner}/{repo}/git/commits" --input - --jq .sha)
          gh api -X PATCH "repos/{owner}/{repo}/git/refs/heads/$BRANCH" -f sha="$commit" -F force=false > /dev/null
          echo "Committed the refreshed libraries to the pull request as $commit."
