name: Backport merged PR

on:
  pull_request_target:
    types: [closed, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backport:
    name: Backport to maintenance branch
    runs-on: ubuntu-latest
    # The keys of the CI app are secrets of this environment, which allows only main. A
    # workflow on another branch, such as the branch of a pull request, cannot read them.
    environment: maho-ci
    permissions:
      contents: write
      pull-requests: write
    # Only act on a merged PR: either it was just merged carrying a backport
    # label, or a backport label was added to an already-merged PR (retroactive).
    if: >
      github.event.pull_request.merged
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && startsWith(github.event.label.name, 'backport ')
        )
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open backport pull requests
        id: backport
        uses: korthout/backport-action@0ebd44f9c79a4a0a171200dcdcceec3ed9ca732f # v4.7.1
        with:
          # Pattern-based labels: the label `backport 26.7` targets branch `26.7`.
          # No per-release config: create the branch + label and it just works.
          label_pattern: '^backport ([^ ]+)$'
          pull_title: '[Backport ${target_branch}] ${pull_title}'
          pull_description: |-
            Automated backport of #${pull_number} to `${target_branch}`.

            Review and merge to ship the fix in the next `${target_branch}.x`
            patch release.
          # Leave the source PR's non-backport labels off the backport PR.
          copy_labels_pattern: '^(?!backport ).*$'
          # A conflicting cherry-pick still gets a draft PR with the conflict
          # markers committed, so the resolution happens on a branch instead of
          # the backport silently evaporating. Such a target still counts as
          # successful, so only a real failure turns this job red.
          experimental: '{ "conflict_resolution": "draft_commit_conflicts" }'

      # Only admins and the CI app may change a release branch, so the merge uses the token of
      # the app. The app has write access to contents and pull requests only.
      - name: Get a token of the CI app
        id: app-token
        if: ${{ !cancelled() && contains(toJSON(github.event.pull_request.labels.*.name), '"backport ') }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAHO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAHO_CI_APP_PRIVATE_KEY }}

      # A backport without a conflict is merged at once. A conflict gives a draft pull request,
      # which waits for a maintainer. The step looks up every open backport of the source pull
      # request, not only the ones that this run created: a rerun after a failed merge finds
      # the pull request of the first run, which the action then skips.
      - name: Merge the backports without a conflict
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREFIX: backport-${{ github.event.pull_request.number }}-to-
        run: |
          NUMBERS=$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"$PREFIX\")) | .number] | join(\" \")")
          STATUS=0
          for number in $NUMBERS; do
            if [ "$(gh pr view "$number" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "#$number has a conflict, so it stays open."
              continue
            fi
            # GitHub computes the mergeability of a new pull request after a short delay
            for _ in 1 2 3 4 5 6; do
              if gh pr merge "$number" --squash; then
                continue 2
              fi
              sleep 10
            done
            echo "::error::Could not merge the backport #$number."
            STATUS=1
          done
          exit $STATUS

      # The action reports per-target failures only as a comment on the source
      # PR, which is easy to miss on an already-merged PR. Mirror it into the
      # job status. Note that GITHUB_TOKEN carries no `workflows` scope, so a
      # PR touching `.github/workflows/**` always lands here and has to be
      # backported by hand.
      - name: Fail when a target could not be backported
        if: steps.backport.outputs.was_successful == 'false'
        env:
          RESULT_BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
        run: |
          echo "::error::Backport failed, see the comment on the source PR: $RESULT_BY_TARGET"
          exit 1
