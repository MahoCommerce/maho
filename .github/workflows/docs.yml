name: Docs

# mahocommerce.com builds its user guide, developer docs, API docs and hosting docs from this
# repository. This workflow builds the site with the docs of the pull request. After a push to main,
# or when you run it by hand on main, it starts a deploy of the site. For a pull request, it uploads
# the site as an artifact, and docs-preview.yml publishes it.

on:
  pull_request:
    paths: &docs_paths
      - 'docs/**'
      - 'app/code/core/*/*/docs/**'
      - 'app/code/core/*/*/etc/config.xml'
      - '.github/workflows/docs.yml'
      - '.github/docs-preview/**'
  push:
    branches:
      - main
    paths: *docs_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mahocommerce.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: maho
          # For a pull request, HEAD^1 of the merge commit is the base, so the preview lists the changed pages.
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout the website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MahoCommerce/mahocommerce.com
          path: site
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install dependencies
        run: pip install -r site/requirements.txt

      # The privacy plugin downloads each external asset and the social plugin draws each card.
      # Without the cache, every build repeats this work and fails when a remote host is slow.
      - name: Cache the plugin files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.cache/plugin
          key: mkdocs-plugins-${{ hashFiles('site/requirements.txt') }}-${{ github.run_id }}
          restore-keys: mkdocs-plugins-${{ hashFiles('site/requirements.txt') }}-

      # A broken link, a broken anchor or a page that is missing from a .nav.yml fails the build.
      - name: Build
        working-directory: site
        env:
          MAHO_DOCS_SOURCE: ${{ github.workspace }}/maho
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --strict

      # The pull request number is in the artifact because workflow_run has no pull request for a fork.
      - name: Prepare the preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir site/site/_preview
          git -C maho diff --name-status --no-renames HEAD^1 HEAD \
            | python maho/.github/docs-preview/changed_pages.py maho site/hooks/maho_docs.py site/site "$PR_NUMBER" "$REPOSITORY" \
            > site/site/_preview/changed.json
          cp maho/.github/docs-preview/preview.js site/site/_preview/
          find site/site -name '*.html' -exec sed -i 's#</body>#<script src="/_preview/preview.js" defer></script></body>#' {} +
          printf '/*\n  X-Robots-Tag: noindex\n' > site/site/_headers
          echo "$PR_NUMBER" > site/site/pr-number.txt

      - name: Upload the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: site/site
          retention-days: 1

  deploy:
    name: Deploy mahocommerce.com
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Call the deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "The DOCS_DEPLOY_HOOK secret is not set, so the site updates on its next deploy."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
