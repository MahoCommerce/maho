name: Storage buckets

# Runs the storage mount tests against real bucket services: MinIO for S3 and Azurite for
# Azure Blob Storage. The GCS test builds the adapter and its public URL, because no emulator
# works with the Google client without extra options. The suite needs no database: the tests
# build their mounts directly, so no ./maho install runs here.

# Only the storage code can break these tests, so the job stays off every other pull request.
on:
  push:
    branches:
      - main
    paths: &storage_paths
      - 'lib/Maho/Storage/**'
      - 'tests/Backend/Unit/Maho/Storage/**'
      - '.github/workflows/storage-remote.yml'
      - 'composer.json'
  pull_request:
    paths: *storage_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-remote:
    name: Storage mounts on MinIO, Azurite and GCS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="mc ready local"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.33.0
        command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
        ports:
          - 10000:10000

    env:
      MAHO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MAHO_TEST_S3_KEY: minioadmin
      MAHO_TEST_S3_SECRET: minioadmin
      MAHO_TEST_S3_BUCKET: maho-test
      # The well-known development account of Azurite, not a secret.
      MAHO_TEST_AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: opcache

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Maho suggests the remote adapter packages and never installs them, so the job installs
      # them here. This also proves that the documented `composer require` lines still work.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-*
          composer require --no-progress --ignore-platform-req=ext-* league/flysystem-aws-s3-v3 league/flysystem-google-cloud-storage azure-oss/storage-blob-flysystem

      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0
            sleep 1
          done
          exit 1

      # --testsuite keeps the Browser suite out: its files need Playwright at load time.
      - name: Run the bucket storage tests
        run: ./vendor/bin/pest --display-errors --display-warnings --testsuite=Backend --group=storage-s3,storage-azure,storage-gcs
