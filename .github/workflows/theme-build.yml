name: Check Compiled Theme CSS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-theme-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-*
          npm ci

      - name: Rebuild the theme CSS
        run: ./maho dev:frontend:theme:build

      - name: Verify the compiled CSS is up to date
        run: |
          # The build overwrites the committed css/*.css bundles. If anything
          # changed, the theme source (src/*.css) was edited without recompiling.
          if ! git diff --exit-code -- public/skin/frontend; then
            echo ""
            echo "::error::Compiled theme CSS is out of date. You changed a theme source file (public/skin/frontend/*/*/src/*.css) but did not recompile. Run './maho dev:frontend:theme:build' and commit the updated css/*.css bundles."
            exit 1
          fi
          echo "Compiled theme CSS is up to date."
