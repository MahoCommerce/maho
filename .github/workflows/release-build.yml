name: Release build

# Run this on a draft release, before it is published: an immutable release accepts no new assets.
# The build and the signature come from a workflow in MahoCommerce/infrastructure, so a change in
# this repository cannot change how a release is built or signed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release, for example 26.11.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Package, SBOM and provenance
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: MahoCommerce/infrastructure/.github/workflows/release-build.yml@838f963c8cf36738e086286f39cdd998692b8701 # main
    with:
      tag: ${{ inputs.tag }}
