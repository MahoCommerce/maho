name: Docs preview

# Publishes the site that docs.yml builds for a pull request to the maho-docs-preview project of
# Cloudflare Pages, at https://pr-<number>.maho-docs-preview.pages.dev, and links it in a comment.
# It is a second workflow because a pull request from a fork gets no secrets. It runs no code of the
# pull request: it uploads the built files only. docs-preview-cleanup.yml deletes the preview.

on:
  workflow_run:
    workflows: [Docs]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the preview
    if: >-
      github.repository == 'MahoCommerce/maho'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download the preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The pull request writes the artifact, so the number must name an open pull request at this commit.
      - name: Read the pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(cat preview/pr-number.txt)
          rm preview/pr-number.txt
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "The artifact has no valid pull request number." >&2
            exit 1
          fi
          if [ "$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.state + " " + .head.sha')" != "open $HEAD_SHA" ]; then
            echo "Pull request $number is closed or has a newer commit, so this preview is out of date."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        if: steps.pr.outputs.number
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview --project-name=maho-docs-preview --branch=pr-${{ steps.pr.outputs.number }} --commit-hash=${{ github.event.workflow_run.head_sha }} --commit-dirty=true

      - name: Link the preview in the pull request
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker='<!-- docs-preview -->'
          base="https://pr-$NUMBER.maho-docs-preview.pages.dev/"
          # The pull request writes changed.json, so only paths of letters, digits and / - _ . reach the comment.
          pages=$(jq -j --arg base "$base" '
            def safe: select(type == "string" and test("^[a-z0-9][a-z0-9_./-]*/$") and (contains("..") | not));
            ([.changed[]? | safe | "- \($base)\(.)"] | if length > 0 then "\n\nChanged pages:\n" + join("\n") else "\n\nNo page changed." end),
            ([.removed[]? | safe | "- `\(.)`"] | if length > 0 then "\n\nRemoved pages:\n" + join("\n") else "" end)
          ' preview/_preview/changed.json)
          body="$marker
          The docs of this pull request are at $base (commit ${HEAD_SHA:0:7}).$pages"
          # A new comment for each commit puts the link below the commits in the timeline.
          for id in $(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id"); do
            gh api --method DELETE "repos/$REPOSITORY/issues/comments/$id" > /dev/null
          done
          gh api "repos/$REPOSITORY/issues/$NUMBER/comments" -f body="$body" > /dev/null
